[project]
name = "ai-engg-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anuj Kumar Sharma", email = "anuj55149@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-openai>=1.6.7",
    "langchain-openrouter>=0.2.9",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "markdown>=3.11",
    "openai>=3.24.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
    "scikit-learn>=1.9.1",
    "unstructured[pdf]>=0.27.10",
]

[project.scripts]
ai-engg-rag = "ai_engg_rag:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
